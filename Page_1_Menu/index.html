<!-- Page_1_Menu/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spice Junction - Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="main-nav">
        <div class="logo">Spice Junction</div>
        <ul>
            <li><a href="../Page_1_Menu/index.html" class="active">Menu</a></li>
            <li><a href="../Page_2_About/index.html">About</a></li>
            <li><a href="../Page_3_Careers/careers.html">Careers</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Spice Junction</h1>
        <p>A Floor of Delicious Food with Authentic Flavours of Spice</p>
    </header>

    <section class="filter-section">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Starters">Starters</button>
        <button class="filter-btn" data-category="Main Course">Main Course</button>
        <button class="filter-btn" data-category="Biryani">Biryani</button>
        <button class="filter-btn" data-category="Desserts">Desserts</button>
        <button class="filter-btn" data-category="Beverages">Beverages</button>
    </section>

    <section class="menu-container" id="menuContainer"></section>

    <!-- Sticky Cart Bar -->
    <div class="cart-bar" id="cartBar">
        <div>
            <strong id="cartCount">0</strong> Items in Cart
        </div>
        <div>
            Total: ₹<strong id="cartTotal">0</strong>
        </div>
        <div class="cart-details-toggle" id="cartToggleBtn">▼ View Details</div>
    </div>
    
    <!-- Cart Details Popup (hidden initially) -->
    <div class="cart-details" id="cartDetails">
        <h4>Your Order</h4>
        <div id="cartItemsList"></div>
        <div class="cart-summary">Total: ₹<span id="cartDetailTotal">0</span></div>
        <button id="clearCartBtn">Clear Cart</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
