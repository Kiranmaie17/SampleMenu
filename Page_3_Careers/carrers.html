<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers - Spice Junction</title>
    <link rel="stylesheet" href="careers.css">
</head>
<body>
    <nav class="careers-nav">
        <div class="logo">Spice Junction</div>
        <ul>
            <li><a href="../Page_1_Menu/index.html">Menu</a></li>
            <li><a href="../Page_2_About/index.html">About</a></li>
            <li><a href="careers.html" class="active">Careers</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Join Our Team at Spice Junction</h1>
        <p class="subtitle">We are looking for passionate individuals who love food and hospitality. Be part of our growing family!</p>
        
        <div id="successMessage" class="success-message"></div>
        <div id="errorMessage" class="error-message"></div>
        
        <form id="applicationForm">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
                <small class="error" id="nameError"></small>
            </div>
            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="email" placeholder="you@example.com">
                <small class="error" id="emailError"></small>
            </div>
            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" id="phone" placeholder="9876543210">
                <small class="error" id="phoneError"></small>
            </div>
            <div class="form-group">
                <label>Position Applied For *</label>
                <select id="position">
                    <option value="">Select Position</option>
                    <option>Chef</option>
                    <option>Waiter</option>
                    <option>Manager</option>
                    <option>Delivery Partner</option>
                    <option>Cashier</option>
                </select>
                <small class="error" id="positionError"></small>
            </div>
            <div class="form-group">
                <label>Experience (in years)</label>
                <input type="number" id="experience" min="0" step="0.5" placeholder="0">
                <small class="error" id="experienceError"></small>
            </div>
            <div class="form-group">
                <label>Why should we hire you? * (Min 20 characters)</label>
                <textarea id="reason" placeholder="Describe your passion and skills..."></textarea>
                <small class="error" id="reasonError"></small>
            </div>
            <button type="submit" id="submitBtn">Submit Application</button>
        </form>
    </div>

    <script type="module" src="careers.js"></script>
</body>
</html>
